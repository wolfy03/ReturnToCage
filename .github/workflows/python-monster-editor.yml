name: Python Monster Editor

on:
  push:
    paths:
      - 'tools/python_monster_editor/**'
      - 'tools/monster_bridge/**'
      - 'docs/monster_editor*.md'
      - 'gameplay/actors/enemies/**'
      - 'gameplay/components/network_enemy_component.gd'
      - 'core/models/network/enemy_runtime_snapshot.gd'
      - 'data/content/enemies/**'
      - 'data/content/loot/**'
      - 'data/definitions/enemy_definition.gd'
      - 'presentation/enemy/**'
      - 'presentation/definitions/enemy_animation_profile.gd'
      - 'assets/characters/enemies/**'
      - '.github/workflows/python-monster-editor.yml'
  pull_request:
    paths:
      - 'tools/python_monster_editor/**'
      - 'tools/monster_bridge/**'
      - 'docs/monster_editor*.md'
      - 'gameplay/actors/enemies/**'
      - 'gameplay/components/network_enemy_component.gd'
      - 'core/models/network/enemy_runtime_snapshot.gd'
      - 'data/content/enemies/**'
      - 'data/content/loot/**'
      - 'data/definitions/enemy_definition.gd'
      - 'presentation/enemy/**'
      - 'presentation/definitions/enemy_animation_profile.gd'
      - 'assets/characters/enemies/**'
      - '.github/workflows/python-monster-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Install pinned pytest
        run: python -m pip install -r tools/python_monster_editor/requirements.txt
      - name: Document, storage, validation and contract tests
        run: python -m pytest tools/python_monster_editor/tests -q -rs -p no:cacheprovider
      - name: Static validation of the example documents
        shell: bash
        run: python -X utf8 tools/python_monster_editor/validate.py tools/python_monster_editor/examples/*.rtcmonster --project .

  godot-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Install pinned Godot
        shell: bash
        run: |
          version=$(cat .godot-version)
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/${archive}" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project resources
        run: |
          "$GODOT" --headless --path . --editor --quit
      - name: Compare the example documents with the real Godot resources
        run: python -u -X utf8 tools/python_monster_editor/check_godot_contract.py --godot "$GODOT" --artifacts "$RUNNER_TEMP/monster-contract"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Monster-Editor-contract-evidence
          path: ${{ runner.temp }}/monster-contract/

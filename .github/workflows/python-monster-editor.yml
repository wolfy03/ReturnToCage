name: Python Monster Editor

# Everything the monster contract depends on. A change to any of these can make
# the example documents or the registry contract wrong, so each one runs the checks.
on:
  push:
    paths:
      - 'tools/python_monster_editor/**'
      - 'tools/monster_bridge/**'
      - 'docs/monster_editor*.md'
      - 'project.godot'
      - '.godot-version'
      - 'autoload/content_registry.gd'
      - 'core/network/network_protocol.gd'
      - 'core/models/network/enemy_runtime_snapshot.gd'
      - 'data/definitions/content_definition.gd'
      - 'data/definitions/enemy_definition.gd'
      - 'data/definitions/loot_table_definition.gd'
      - 'data/content/enemies/**'
      - 'data/content/loot/**'
      - 'data/content/items/**'
      - 'gameplay/actors/enemies/**'
      - 'gameplay/components/health_component.gd'
      - 'gameplay/components/hurtbox_component.gd'
      - 'gameplay/components/damage_context.gd'
      - 'gameplay/components/network_enemy_component.gd'
      - 'presentation/enemy/**'
      - 'presentation/definitions/enemy_animation_profile.gd'
      - 'assets/characters/enemies/**'
      - 'world/multiplayer/enemy_spawn_manager.gd'
      - '.github/workflows/python-monster-editor.yml'
  pull_request:
    paths:
      - 'tools/python_monster_editor/**'
      - 'tools/monster_bridge/**'
      - 'docs/monster_editor*.md'
      - 'project.godot'
      - '.godot-version'
      - 'autoload/content_registry.gd'
      - 'core/network/network_protocol.gd'
      - 'core/models/network/enemy_runtime_snapshot.gd'
      - 'data/definitions/content_definition.gd'
      - 'data/definitions/enemy_definition.gd'
      - 'data/definitions/loot_table_definition.gd'
      - 'data/content/enemies/**'
      - 'data/content/loot/**'
      - 'data/content/items/**'
      - 'gameplay/actors/enemies/**'
      - 'gameplay/components/health_component.gd'
      - 'gameplay/components/hurtbox_component.gd'
      - 'gameplay/components/damage_context.gd'
      - 'gameplay/components/network_enemy_component.gd'
      - 'presentation/enemy/**'
      - 'presentation/definitions/enemy_animation_profile.gd'
      - 'assets/characters/enemies/**'
      - 'world/multiplayer/enemy_spawn_manager.gd'
      - '.github/workflows/python-monster-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Install pinned dependencies (pytest, PySide6)
        run: python -m pip install -r tools/python_monster_editor/requirements.txt
      - name: Qt runtime libraries (Linux has no display; the GUI tests use the offscreen platform)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      # Core, application, bridge (with a stand-in executable) and GUI tests. On Linux the two tests that need
      # window-level shortcuts are skipped and say so; Windows runs them on the native platform.
      - name: Core, application, bridge and GUI tests
        run: python -X faulthandler -m pytest tools/python_monster_editor/tests -q -rs -p no:cacheprovider --junitxml=monster-editor-tests.xml
      # The STEP 3 stabilization gates by name, so a regression is visible without reading the whole log:
      # frame / clip / image / hitbox reference integrity, staging path safety, ownership and cleanup on every
      # failure path, bridge response and resource path validation, texture filter and readback comparison,
      # stale results, the playback contract and the byte-budget frame cache. (Also part of the run above.)
      - name: Stabilization gates (reference integrity, staging safety, response validation, playback, cache)
        run: python -X faulthandler -m pytest tools/python_monster_editor/tests/test_reference_integrity.py tools/python_monster_editor/tests/test_staging.py tools/python_monster_editor/tests/test_rendering.py tools/python_monster_editor/tests/test_playback_cache.py tools/python_monster_editor/tests/test_gui_stabilization.py tools/python_monster_editor/tests/test_step3_s2.py tools/python_monster_editor/tests/test_step3_final.py -q -rs -p no:cacheprovider
      - name: Frame cache budget against the process's real memory
        run: python -X utf8 tools/python_monster_editor/check_frame_cache.py --output monster-editor-frame-cache.json
      - name: Static validation of the example documents
        shell: bash
        run: python -X utf8 tools/python_monster_editor/validate.py tools/python_monster_editor/examples/*.rtcmonster --project . | tee monster-editor-examples.txt
      - name: Schema reference in the documentation is current
        shell: bash
        run: |
          cd tools/python_monster_editor
          python -X utf8 -m rtcmonster.reference --update ../../docs/monster_editor_schema_v1.md
          git diff --exit-code -- ../../docs/monster_editor_schema_v1.md
      - name: Core measurements (informational)
        run: python -X utf8 tools/python_monster_editor/benchmark.py --output monster-editor-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Monster-Editor-core-${{ matrix.os }}
          path: |
            monster-editor-tests.xml
            monster-editor-examples.txt
            monster-editor-benchmark.json
            monster-editor-frame-cache.json

  gui-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          architecture: x64
      - name: Install pinned dependencies
        run: python -m pip install -r tools/python_monster_editor/requirements.txt
      - name: Obtain and verify official Godot 4.7.2
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2.zip'
          $engine = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw 'Godot Windows ZIP checksum mismatch'
          }
          Expand-Archive -LiteralPath $download -DestinationPath $engine
          "RTC_GODOT=$(Join-Path $engine 'Godot_v4.7.2-stable_win64.exe')" >> $env:GITHUB_ENV
          "RTC_GODOT_CONSOLE=$(Join-Path $engine 'Godot_v4.7.2-stable_win64_console.exe')" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/monster-gui" | Out-Null
      - name: Import project resources
        run: |
          & $env:RTC_GODOT_CONSOLE --headless --path . --import 2>&1 | Tee-Object "$env:RUNNER_TEMP/monster-gui/import.log"
          if (Select-String -Path "$env:RUNNER_TEMP/monster-gui/import.log" -Pattern 'SCRIPT ERROR:|Parse Error' -Quiet) {
            throw 'the project import reported script errors'
          }
      # Real key presses and clicks on the native platform: new monster, edit, undo/redo, loot, validation,
      # save, registry check and both legacy imports through the real Godot, clone, close protection, reopen,
      # then the animation and collision workspace: cut clips, move a frame with its hurtbox set and hit frame,
      # drag a shape, cancel a drag with Esc, play and pause.
      - name: GUI workflow with real input and real Godot at 100%, 150% and 200% scale
        run: |
          foreach ($scale in @('1', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            python -X utf8 -X faulthandler tools/python_monster_editor/main.py --smoke-report "$env:RUNNER_TEMP/monster-gui/smoke-$scale/report.json" --smoke-shots "$env:RUNNER_TEMP/monster-gui/smoke-$scale" --project . --godot $env:RTC_GODOT
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Bridge and legacy import against the real Godot, an isolated project with new monsters, failure cases
        run: python -u -X utf8 tools/python_monster_editor/check_godot_import.py --godot $env:RTC_GODOT_CONSOLE --artifacts "$env:RUNNER_TEMP/monster-gui/import"
      - name: Stage presentation resources in a project copy with the real Godot and compare the readback
        run: python -u -X utf8 tools/python_monster_editor/check_godot_stage.py --godot $env:RTC_GODOT_CONSOLE --artifacts "$env:RUNNER_TEMP/monster-gui/stage"
      # The real renderer, with a window. A runner that cannot render reports NOT_EVALUATED (and the job
      # summary says so); it is never replaced by a headless check. A failed comparison fails the job.
      - name: Draw the staged monsters with Godot's renderer and compare with the editor preview
        run: |
          python -u -X utf8 tools/python_monster_editor/check_godot_render.py --godot $env:RTC_GODOT --artifacts "$env:RUNNER_TEMP/monster-gui/render" --allow-no-renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content "$env:RUNNER_TEMP/monster-gui/render/render_report.json" -Raw | ConvertFrom-Json
          "### Godot rendering check: $($report.status)" >> $env:GITHUB_STEP_SUMMARY
          "renderer: $($report.renderer.rendering_method) / $($report.renderer.rendering_driver) / $($report.renderer.video_adapter)" >> $env:GITHUB_STEP_SUMMARY
          if ($report.unavailable) { "not evaluated here: $($report.unavailable)" >> $env:GITHUB_STEP_SUMMARY }
      - name: The checks left the working tree untouched
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Record what was verified
        if: always()
        run: |
          @("commit=$env:GITHUB_SHA", "ref=$env:GITHUB_REF", "python=$(python --version)", "runner=$env:RUNNER_OS $env:RUNNER_ARCH") |
            Set-Content "$env:RUNNER_TEMP/monster-gui/environment.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Monster-Editor-gui-evidence
          path: ${{ runner.temp }}/monster-gui/

  godot-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Install the pinned Godot and confirm its version
        shell: bash
        run: |
          version=$(cat .godot-version)
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/${archive}" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot="$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64"
          chmod +x "$godot"
          actual=$("$godot" --version)
          echo "Godot $actual"
          case "$actual" in "$version".*) ;; *) echo "expected Godot $version, got $actual"; exit 1 ;; esac
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Import project resources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/monster-contract"
          timeout 600 "$GODOT" --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/monster-contract/import.log"
          if grep -E "SCRIPT ERROR:|Parse Error" "$RUNNER_TEMP/monster-contract/import.log"; then
            echo "the project import reported script errors"; exit 1
          fi
      - name: Environment, registry and legacy contracts against the real engine
        run: python -u -X utf8 tools/python_monster_editor/check_godot_contract.py --godot "$GODOT" --artifacts "$RUNNER_TEMP/monster-contract/live"
      - name: A new enemy needs no example, and a broken one is caught (isolated project copy)
        run: python -u -X utf8 tools/python_monster_editor/check_contract_extensibility.py --godot "$GODOT" --artifacts "$RUNNER_TEMP/monster-contract/extensibility"
      - name: Bridge and legacy import on Linux (same checks as Windows)
        run: python -u -X utf8 tools/python_monster_editor/check_godot_import.py --godot "$GODOT" --artifacts "$RUNNER_TEMP/monster-contract/import"
      - name: Stage presentation resources in a project copy on Linux (same checks as Windows)
        run: python -u -X utf8 tools/python_monster_editor/check_godot_stage.py --godot "$GODOT" --artifacts "$RUNNER_TEMP/monster-contract/stage"
      - name: Record what was verified
        if: always()
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "godot=$("$GODOT" --version 2>/dev/null || echo unknown)"
            echo "python=$(python --version)"
            echo "runner=$RUNNER_OS $RUNNER_ARCH"
          } > "$RUNNER_TEMP/monster-contract/environment.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Monster-Editor-contract-evidence
          path: ${{ runner.temp }}/monster-contract/

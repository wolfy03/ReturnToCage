name: Python Map Editor

on:
  push:
    paths:
      - 'tools/python_map_editor/**'
      - 'tools/map_bridge/**'
      - 'docs/python_map_editor*.md'
      - '.github/workflows/python-map-editor.yml'
  pull_request:
    paths:
      - 'tools/python_map_editor/**'
      - 'tools/map_bridge/**'
      - 'docs/python_map_editor*.md'
      - '.github/workflows/python-map-editor.yml'
  workflow_dispatch:
    inputs:
      stability:
        description: Run the sequential Godot and packaged editor stability gate
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  document-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Test document I/O including actual symbolic links
        run: |
          pytest_pin=$(grep '^pytest==' tools/python_map_editor/requirements.txt)
          python -m pip install "$pytest_pin"
          python -m pytest tools/python_map_editor/tests -q -rs -p no:cacheprovider

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/python_map_editor/requirements.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r tools/python_map_editor/requirements.txt
      - name: Document regression tests
        run: python -m pytest tools/python_map_editor/tests -q -rs -p no:cacheprovider
      - name: Qt source smoke at 100%, 150% and 200% scale
        run: |
          foreach ($scale in @('1', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            python -X utf8 tools/python_map_editor/main.py --smoke-report "build/map-editor-qa/source-smoke-$scale.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $region = (Get-Content "build/map-editor-qa/source-smoke-$scale.json" -Raw | ConvertFrom-Json).region_fixture
            if (-not $region) { throw 'The offline smoke did not write a V4 fixture' }
            python -X utf8 tools/python_map_editor/main.py --smoke-report "build/map-editor-qa/source-region-reopen-$scale.json" --smoke-region-reopen $region
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Obtain and verify official Godot 4.7.2
        id: godot
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2.zip'
          $engine = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw 'Godot Windows ZIP checksum mismatch'
          }
          Expand-Archive -LiteralPath $download -DestinationPath $engine
          $godot = Join-Path $engine 'Godot_v4.7.2-stable_win64.exe'
          Get-FileHash -LiteralPath $godot | Format-List Algorithm,Hash
          "RTC_VALIDATION_GODOT=$godot" >> $env:GITHUB_ENV
      - name: Sewer scene, resources, and traversal round-trips
        run: python -u -X utf8 tools/python_map_editor/check_scene_bridge.py --godot $env:RTC_VALIDATION_GODOT --artifacts "$env:RUNNER_TEMP/rtc-map-evidence"
      - name: V4 markers, new regions, runtime and pair publication
        run: python -u -X utf8 tools/python_map_editor/check_v4_region_bridge.py --godot $env:RTC_VALIDATION_GODOT --artifacts "$env:RUNNER_TEMP/rtc-map-evidence/v4"
      - name: Copy scene integration logs
        if: always()
        run: |
          if (Test-Path "$env:RUNNER_TEMP/rtc-map-evidence") {
            Copy-Item "$env:RUNNER_TEMP/rtc-map-evidence" build/map-editor-qa/bridge-integration -Recurse
          }
      - name: Build Windows OneDir and ZIP
        id: package
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: |
          & ./tools/python_map_editor/build_windows.ps1 -Python (Get-Command python).Source -OutputRoot build/map-editor-ci
      - name: Run the packaged EXE on Windows
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          $archives = @(Get-ChildItem -Path build/map-editor-ci -Recurse -Filter 'ReturnToCageMapEditor-PY-STEP5-win-x64.zip')
          if ($archives.Count -ne 1) { throw 'Expected one map editor ZIP' }
          python -X utf8 tools/python_map_editor/verify_windows_package.py $archives[0].FullName --artifacts build/map-editor-qa --bridge-project . --godot $env:RTC_VALIDATION_GODOT --include-design
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: ReturnToCageMapEditor-win-x64
          path: build/map-editor-ci/**/ReturnToCageMapEditor-PY-STEP5-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Python-Map-Editor-verification
          path: build/map-editor-qa/

  stability:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stability }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/python_map_editor/requirements.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r tools/python_map_editor/requirements.txt
      - name: Obtain and verify official Godot 4.7.2
        id: godot
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2.zip'
          $engine = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw 'Godot Windows ZIP checksum mismatch'
          }
          Expand-Archive -LiteralPath $download -DestinationPath $engine
          $godot = Join-Path $engine 'Godot_v4.7.2-stable_win64.exe'
          Get-FileHash -LiteralPath $godot | Format-List Algorithm,Hash
          "RTC_VALIDATION_GODOT=$godot" >> $env:GITHUB_ENV
      - name: Obtain Microsoft ProcDump for optional crash capture
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'rtc-procdump.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'rtc-procdump'
          try {
            Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $folder
            $program = Join-Path $folder 'procdump64.exe'
            $signature = Get-AuthenticodeSignature -LiteralPath $program
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw 'ProcDump Authenticode validation failed'
            }
            "RTC_PROCDUMP=$program" >> $env:GITHUB_ENV
          } catch {
            Write-Warning "Diagnostic dump capture unavailable ($($_.Exception.Message))"
          }
      - name: Sequential isolation and ten no-op and edited round-trips
        run: |
          $capture = @()
          if ($env:RTC_PROCDUMP) { $capture = @('--procdump', $env:RTC_PROCDUMP) }
          python -u -X utf8 tools/python_map_editor/bridge_stability.py --godot $env:RTC_VALIDATION_GODOT --commands --round-trips 10 --artifacts "$env:RUNNER_TEMP/rtc-bridge-stability" @capture
          exit $LASTEXITCODE
      - name: Build Windows OneDir for the stability gate
        id: stability-package
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: |
          & ./tools/python_map_editor/build_windows.ps1 -Python (Get-Command python).Source -OutputRoot build/map-editor-stability
      - name: Ten independent packaged Godot publish runs
        if: ${{ !cancelled() && steps.stability-package.outcome == 'success' }}
        run: |
          $archives = @(Get-ChildItem build/map-editor-stability -Recurse -Filter 'ReturnToCageMapEditor-PY-STEP5-win-x64.zip')
          if ($archives.Count -ne 1) { throw 'Expected one map editor ZIP' }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ReturnToCageMapEditor.exe'
          $created = $false
          try {
            if (-not (Test-Path -LiteralPath $key)) {
              try {
                $dumps = (New-Item -ItemType Directory -Path build/map-editor-stability-qa/exe-dumps -Force).FullName
                New-Item -Path $key -Force | Out-Null
                $created = $true
                New-ItemProperty -LiteralPath $key -Name DumpFolder -PropertyType ExpandString -Value $dumps | Out-Null
                New-ItemProperty -LiteralPath $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
                New-ItemProperty -LiteralPath $key -Name DumpCount -PropertyType DWord -Value 10 | Out-Null
              } catch {
                Write-Warning "EXE minidump capture unavailable ($($_.Exception.Message))"
              }
            }
            python -u -X utf8 tools/python_map_editor/verify_windows_package.py $archives[0].FullName --artifacts build/map-editor-stability-qa --bridge-project . --godot $env:RTC_VALIDATION_GODOT --bridge-repeats 10 --include-design
            $packageExit = $LASTEXITCODE
          } finally {
            if ($created) { Remove-Item -LiteralPath $key }
          }
          exit $packageExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Python-Map-Editor-stability-evidence
          path: |
            ${{ runner.temp }}/rtc-bridge-stability/
            build/map-editor-stability-qa/

  design-stability:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stability }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [v3, v4, flat, platform, publish]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          architecture: x64
      - name: Verify official Godot and run independent snapshots
        shell: pwsh
        env:
          RTC_PROFILE: ${{ matrix.profile }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2.zip'
          $engine = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw 'Godot Windows ZIP checksum mismatch'
          }
          Expand-Archive -LiteralPath $download -DestinationPath $engine
          $godot = Join-Path $engine 'Godot_v4.7.2-stable_win64.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'rtc-design-evidence'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Godot_v4.7.2-stable_win64.exe'
          $created = $false
          try {
            if (-not (Test-Path -LiteralPath $key)) {
              try {
                $dumps = (New-Item -ItemType Directory -Path "$evidence/dumps" -Force).FullName
                New-Item -Path $key -Force | Out-Null
                $created = $true
                New-ItemProperty -LiteralPath $key -Name DumpFolder -PropertyType ExpandString -Value $dumps | Out-Null
                New-ItemProperty -LiteralPath $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
              } catch {
                Write-Warning "Godot minidump capture unavailable ($($_.Exception.Message))"
              }
            }
            python -u -X utf8 tools/python_map_editor/design_stability.py --godot $godot --artifacts $evidence --profile $env:RTC_PROFILE
            $trialExit = $LASTEXITCODE
          } finally {
            if ($created) { Remove-Item -LiteralPath $key }
          }
          exit $trialExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Python-Map-Editor-design-stability-${{ matrix.profile }}
          path: ${{ runner.temp }}/rtc-design-evidence/

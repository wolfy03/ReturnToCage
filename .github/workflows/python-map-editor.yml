name: Python Map Editor

on:
  push:
    paths:
      - 'tools/python_map_editor/**'
      - 'tools/map_bridge/**'
      - 'docs/python_map_editor*.md'
      - '.github/workflows/python-map-editor.yml'
  pull_request:
    paths:
      - 'tools/python_map_editor/**'
      - 'tools/map_bridge/**'
      - 'docs/python_map_editor*.md'
      - '.github/workflows/python-map-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Test document I/O including actual symbolic links
        run: |
          pytest_pin=$(grep '^pytest==' tools/python_map_editor/requirements.txt)
          python -m pip install "$pytest_pin"
          python -m pytest tools/python_map_editor/tests -q -rs -p no:cacheprovider

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/python_map_editor/requirements.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r tools/python_map_editor/requirements.txt
      - name: Document regression tests
        run: python -m pytest tools/python_map_editor/tests -q -rs -p no:cacheprovider
      - name: Qt source smoke at 100%, 150% and 200% scale
        run: |
          foreach ($scale in @('1', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            python -X utf8 tools/python_map_editor/main.py --smoke-report "build/map-editor-qa/source-smoke-$scale.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Obtain and verify official Godot 4.7.2
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2.zip'
          $engine = Join-Path $env:RUNNER_TEMP 'godot-rtc-4.7.2'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw 'Godot Windows ZIP checksum mismatch'
          }
          Expand-Archive -LiteralPath $download -DestinationPath $engine
          $godot = Join-Path $engine 'Godot_v4.7.2-stable_win64.exe'
          "RTC_VALIDATION_GODOT=$godot" >> $env:GITHUB_ENV
      - name: Sewer scene, resources, and traversal round-trips
        run: python -u -X utf8 tools/python_map_editor/check_scene_bridge.py --godot $env:RTC_VALIDATION_GODOT --artifacts "$env:RUNNER_TEMP/rtc-map-evidence"
      - name: Copy scene integration logs
        if: always()
        run: |
          if (Test-Path "$env:RUNNER_TEMP/rtc-map-evidence") {
            Copy-Item "$env:RUNNER_TEMP/rtc-map-evidence" build/map-editor-qa/bridge-integration -Recurse
          }
      - name: Build Windows OneDir and ZIP
        run: |
          & ./tools/python_map_editor/build_windows.ps1 -Python (Get-Command python).Source -OutputRoot build/map-editor-ci
      - name: Run the packaged EXE on Windows
        run: |
          $archives = @(Get-ChildItem -Path build/map-editor-ci -Recurse -Filter 'ReturnToCageMapEditor-PY-STEP3-win-x64.zip')
          if ($archives.Count -ne 1) { throw 'Expected one map editor ZIP' }
          python -X utf8 tools/python_map_editor/verify_windows_package.py $archives[0].FullName --artifacts build/map-editor-qa --bridge-project . --godot $env:RTC_VALIDATION_GODOT
      - uses: actions/upload-artifact@v4
        with:
          name: ReturnToCageMapEditor-win-x64
          path: build/map-editor-ci/**/ReturnToCageMapEditor-PY-STEP3-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Python-Map-Editor-verification
          path: build/map-editor-qa/

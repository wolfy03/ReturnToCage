name: Godot validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot
        shell: bash
        run: |
          version=$(cat .godot-version)
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/${archive}" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import, validate, test and restart
        run: python tools/check_project.py --godot "$GODOT"
      - name: Release publication boundary tests
        run: python -m unittest discover -s tools/tests -p test_windows_release_validation.py
      - name: Normal ENet and Host disconnect E2E
        run: |
          python tools/test_multiplayer_local.py --godot "$GODOT" --players 2
          python tools/test_multiplayer_local.py --godot "$GODOT" --players 3
          python tools/test_multiplayer_local.py --godot "$GODOT" --players 2 --host-disconnect
      - name: Process-restart multiplayer E2E
        run: |
          python tools/test_multiplayer_restart.py --godot "$GODOT" --players 2 --scenario valid
          python tools/test_multiplayer_restart.py --godot "$GODOT" --players 2 --scenario invalid
          python tools/test_multiplayer_restart.py --godot "$GODOT" --players 3 --scenario valid
      - name: Individual-world multiplayer E2E
        run: |
          python tools/test_multiplayer_worlds.py --godot "$GODOT" --players 2
          python tools/test_multiplayer_worlds.py --godot "$GODOT" --players 3
      - name: World-scoped runtime multiplayer E2E
        run: |
          python tools/test_multiplayer_world_runtime.py --godot "$GODOT" --players 2
          python tools/test_multiplayer_world_runtime.py --godot "$GODOT" --players 3
      - name: Gameplay authority and lifecycle ENet E2E
        run: |
          python tools/test_multiplayer_authority.py --godot "$GODOT" --players 2
          python tools/test_multiplayer_authority.py --godot "$GODOT" --players 3
          python tools/test_multiplayer_protocol.py --godot "$GODOT" --players 2
      - name: Disconnect menu input and session recovery E2E
        run: python tools/test_multiplayer_disconnect.py --godot "$GODOT" --artifacts build/validation/disconnect-ui
      - name: Host and Client presentation roster ENet E2E
        run: |
          python tools/test_multiplayer_roster.py --godot "$GODOT" --players 2 --artifacts build/validation/roster2
          python tools/test_multiplayer_roster.py --godot "$GODOT" --players 3 --artifacts build/validation/roster3
      - name: Same-process single/multiplayer lifecycle E2E
        run: python tools/test_session_recovery.py --godot "$GODOT" --artifacts build/validation/lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-Session-Lifecycle-Logs
          path: build/validation/lifecycle
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-Player-Roster-Logs
          path: |
            build/validation/roster2
            build/validation/roster3
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-Disconnect-Recovery-Logs
          path: build/validation/disconnect-ui
          if-no-files-found: warn
          retention-days: 14
  windows-demo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure pinned Godot paths
        shell: pwsh
        run: |
          "RTC_GODOT=$env:RUNNER_TEMP\godot" >> $env:GITHUB_ENV
          "RTC_TEMPLATES=$env:APPDATA\Godot\export_templates" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.RTC_TEMPLATES }}
          key: rtc-windows-templates-${{ hashFiles('.godot-version') }}
      - name: Install official Windows editor and export templates
        shell: pwsh
        run: |
          python tools/install_windows_godot.py --editor-dir "$env:RTC_GODOT" --templates-dir "$env:RTC_TEMPLATES"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content .godot-version).Trim()
          "GODOT=$env:RTC_GODOT\Godot_v$version-stable_win64_console.exe" >> $env:GITHUB_ENV
      - name: Configure per-application CI software rendering
        shell: pwsh
        run: |
          python tools/install_windows_ci_renderer.py --destination "$env:RTC_GODOT" --destination build/windows --7zip "$env:ProgramFiles\7-Zip\7z.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LP_NUM_THREADS=2" >> $env:GITHUB_ENV
      - name: Release publication boundary tests
        run: python -m unittest discover -s tools/tests -p test_windows_release_validation.py
      - name: Build release EXE and execute content and ENet validation
        shell: pwsh
        run: python tools/build_windows_demo.py --godot "$env:GODOT" --rendered --rendering-method gl_compatibility
      - name: Disconnect menu input and session recovery E2E
        shell: pwsh
        run: python tools/test_multiplayer_disconnect.py --godot "$env:GODOT" --artifacts build/validation/disconnect-ui
      - name: Host and Client presentation roster ENet E2E
        shell: pwsh
        run: |
          python tools/test_multiplayer_roster.py --godot "$env:GODOT" --players 2 --artifacts build/validation/roster2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_multiplayer_roster.py --godot "$env:GODOT" --players 3 --artifacts build/validation/roster3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReturnToCage-Windows-Demo-x86_64
          path: |
            build/windows/ReturnToCage_Demo.exe
            build/windows/build_manifest.json
            build/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Export-Validation-Logs
          path: |
            build/validation/**/*.log
            build/validation/**/result.json
            build/validation/**/result.json.tmp
            build/validation/**/summary.json
            build/validation/**/steps.json
            build/validation/**/failure.json
            build/validation/**/bootstrap.json
          if-no-files-found: warn
          retention-days: 14
